name: Weekly Market Report

on:
  schedule:
    - cron: "0 0 * * 6"
  workflow_dispatch:

concurrency:
  group: market-pages-deploy
  cancel-in-progress: false

permissions:
  contents: write

env:
  STORAGE_BACKEND: ${{ vars.STORAGE_BACKEND || 'supabase' }}

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Checkout published history
        if: vars.STORAGE_BACKEND == 'json'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages-history

      - name: Restore published data
        if: vars.STORAGE_BACKEND == 'json'
        run: if [ -d pages-history/data ]; then mkdir -p public/data && cp -a pages-history/data/. public/data/; fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run quality checks
        run: python -m compileall -q pipeline main.py intraday.py weekly_report.py && python -m unittest discover -s tests -v

      - name: Generate weekly report
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_PAGES_URL: ${{ secrets.GITHUB_PAGES_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL: ${{ vars.SITE_URL || 'https://ai-market-research-desk.vercel.app' }}
        run: python weekly_report.py

      - name: Prepare weekly publish directory
        if: vars.STORAGE_BACKEND == 'json'
        run: mkdir -p weekly_publish/data/reports && cp public/weekly.html weekly_publish/weekly.html && cp -r public/data/reports/. weekly_publish/data/reports/

      - name: Deploy weekly artifacts to GitHub Pages
        if: vars.STORAGE_BACKEND == 'json'
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./weekly_publish
          branch: gh-pages
          keep_files: true
          allow_empty_commit: true
