name: Build and Deploy Pages

on:
  workflow_dispatch:

concurrency:
  group: market-pages-deploy
  cancel-in-progress: false

permissions:
  contents: write

env:
  STORAGE_BACKEND: ${{ vars.STORAGE_BACKEND || 'json' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Checkout published history
        if: vars.STORAGE_BACKEND != 'supabase'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages-history

      - name: Restore published data
        if: vars.STORAGE_BACKEND != 'supabase'
        run: if [ -d pages-history/data ]; then mkdir -p public/data && cp -a pages-history/data/. public/data/; fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Restore snapshot history from gh-pages
        if: vars.STORAGE_BACKEND != 'supabase'
        run: |
          mkdir -p public/data
          git fetch origin gh-pages --depth=1 2>/dev/null || true
          git checkout FETCH_HEAD -- data 2>/dev/null || true
          if [ -d data ]; then
            cp -r data/. public/data/
            echo "Restored $(ls public/data/*.json 2>/dev/null | wc -l) snapshot files"
          fi
          git ls-tree --name-only FETCH_HEAD 2>/dev/null | grep '^cover_.*\.png$' | while read f; do
            git checkout FETCH_HEAD -- "$f" 2>/dev/null && cp "$f" public/ && echo "Restored cover: $f" || true
          done || true

      - name: Run quality checks
        run: python -m compileall -q pipeline main.py intraday.py weekly_report.py && python -m unittest discover -s tests -v

      - name: Generate page
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_PAGES_URL: ${{ secrets.GITHUB_PAGES_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          OPENAI_TEXT_MODEL: gpt-4o-mini-2024-07-18
          OPENAI_IMAGE_MODEL: gpt-image-1-mini
          GENERATE_AI_IMAGE: true
        run: python main.py

      - name: Deploy to GitHub Pages
        if: vars.STORAGE_BACKEND != 'supabase'
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          branch: gh-pages
          keep_files: true
          allow_empty_commit: true
