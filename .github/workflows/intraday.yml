name: Intraday Sentiment Pipeline

on:
  workflow_dispatch:
    inputs:
      align_to_half_hour:
        description: "준비 후 :30에 생성"
        required: false
        default: true
        type: boolean
      target_kst:
        description: "선택 목표 시각 (YYYY-MM-DD HH:30:00 KST)"
        required: false
        type: string

concurrency:
  group: market-pages-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Checkout published history
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages-history

      - name: Restore published data and live page
        run: |
          if [ -d pages-history/data ]; then
            mkdir -p public/data
            cp -a pages-history/data/. public/data/
          fi
          if [ -f pages-history/live.html ]; then
            mkdir -p public
            cp pages-history/live.html public/live.html
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run quality checks
        run: python -m compileall -q . && python -m unittest discover -s tests -v

      - name: Align scheduled generation to half hour
        if: inputs.align_to_half_hour == true
        shell: bash
        run: |
          requested_target='${{ inputs.target_kst }}'
          if [ -n "$requested_target" ]; then
            if [[ ! "$requested_target" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}[[:space:]][0-9]{2}:30:00$ ]]; then
              echo "target_kst must use YYYY-MM-DD HH:30:00"
              exit 1
            fi
            target_epoch=$(TZ=Asia/Seoul date -d "$requested_target" +%s)
          else
            target_epoch=$(date -u -d "$(date -u +'%Y-%m-%d %H'):30:00" +%s)
          fi
          now_epoch=$(date -u +%s)
          wait_seconds=$((target_epoch - now_epoch))

          if [ "$wait_seconds" -gt 0 ] && [ "$wait_seconds" -le 1500 ]; then
            echo "Preparation complete. Waiting ${wait_seconds}s for the :30 target."
            sleep "$wait_seconds"
          fi

          actual_epoch=$(date -u +%s)
          delay_seconds=$((actual_epoch - target_epoch))
          if [ "$delay_seconds" -lt 0 ]; then delay_seconds=0; fi

          echo "SCHEDULE_TARGET_KST=$(TZ=Asia/Seoul date -d "@${target_epoch}" +'%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"
          echo "SCHEDULE_DELAY_SECONDS=${delay_seconds}" >> "$GITHUB_ENV"
          echo "Generation delay: ${delay_seconds}s"

      - name: Generate intraday snapshot
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_PAGES_URL: ${{ secrets.GITHUB_PAGES_URL }}
          OPENAI_TEXT_MODEL: gpt-4o-mini-2024-07-18
          GENERATE_AI_IMAGE: false
        run: python intraday.py

      - name: Prepare intraday publish directory
        run: mkdir -p intraday_publish/data/intraday && cp public/live.html intraday_publish/live.html && cp -r public/data/intraday/. intraday_publish/data/intraday/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./intraday_publish
          branch: gh-pages
          keep_files: true
          allow_empty_commit: true
